<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarathonNote - 구간 변환기 & 마라톤 캘린더</title>
  <style>
    :root { --bg-dark: #0a0e17; --card-border: #1e293b; --text-main: #f1f5f9; --text-muted: #94a3b8; --accent-neon: #10b981; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { background: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .topbar { flex: none; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 32px;
      max-width: 1100px; width: 100%; margin: 0 auto; padding: 16px 16px 0; border-bottom: 1px solid var(--card-border); }
    .brand { padding-bottom: 12px; color: inherit; text-decoration: none; cursor: pointer; }
    .header-title { display: flex; align-items: center; gap: 12px; }
    .brand-mark { width: 44px; height: 44px; object-fit: contain; flex-shrink: 0; }
    .header-title h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px;
      background: linear-gradient(135deg, #38bdf8, #10b981); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    nav { display: flex; gap: 6px; }
    .tab { background: none; border: none; color: var(--text-muted); font: inherit; font-weight: 600; padding: 12px 16px;
      cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
    .tab.active { color: var(--accent-neon); border-bottom-color: var(--accent-neon); }
    iframe { flex: 1; width: 100%; border: 0; background: var(--bg-dark); }
    iframe[hidden] { display: none; }
    @media (max-width: 640px) {
      .topbar { gap: 0; padding: 12px 12px 0; }
      .header-title h1 { font-size: 1.3rem; }
      nav { width: 100%; }
      .tab { flex: 1; padding: 10px 8px; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="brand" href="#home" data-view="home" title="홈으로">
      <div class="header-title">
        <img src="assets/logo-mark.png" class="brand-mark" alt="MarathonNote 로고">
        <h1>MarathonNote</h1>
      </div>
    </a>
    <nav>
      <button class="tab" data-view="converter">⏱ 구간 변환기</button>
      <button class="tab" data-view="calendar">📅 마라톤 캘린더</button>
    </nav>
  </div>
  <iframe id="home" src="home.html" title="홈"></iframe>
  <iframe id="converter" title="구간 변환기" hidden></iframe>
  <iframe id="calendar" title="마라톤 캘린더" hidden></iframe>
<script>
  const frames = { home: document.getElementById('home'), converter: document.getElementById('converter'), calendar: document.getElementById('calendar') };
  const srcs = { home: 'home.html', converter: 'index.html', calendar: 'calendar.html' };
  function show(view) {
    if (!frames[view]) view = 'home';
    for (const k in frames) {
      frames[k].hidden = k !== view;
      if (k === view && !frames[k].getAttribute('src')) frames[k].src = srcs[k];
    }
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === view));
    try { history.replaceState(null, '', '#' + view); } catch (e) {}
  }
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => show(t.dataset.view)));
  // 로고(MarathonNote)를 누르면 홈으로
  document.querySelector('.brand').addEventListener('click', e => { e.preventDefault(); show('home'); });
  // 홈 화면의 '캘린더에서 보기' 등 탭 안 페이지에서 탭 전환 요청
  window.addEventListener('message', e => {
    if (e.origin === location.origin && e.data && e.data.type === 'show-view') show(e.data.view);
  });
  show(location.hash.slice(1));
</script>
</body>
</html>
