<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>러닝 도구 - 구간 변환기 & 마라톤 캘린더</title>
  <style>
    :root { --bg-dark: #0a0e17; --card-border: #1e293b; --text-main: #f1f5f9; --text-muted: #94a3b8; --accent-neon: #10b981; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { background: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    nav { display: flex; gap: 6px; padding: 0 12px; border-bottom: 1px solid var(--card-border); flex: none; }
    .tab { background: none; border: none; color: var(--text-muted); font: inherit; font-weight: 600; padding: 12px 16px;
      cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .tab.active { color: var(--accent-neon); border-bottom-color: var(--accent-neon); }
    iframe { flex: 1; width: 100%; border: 0; background: var(--bg-dark); }
    iframe[hidden] { display: none; }
  </style>
</head>
<body>
  <nav>
    <button class="tab active" data-view="converter">⏱ 구간 변환기</button>
    <button class="tab" data-view="calendar">📅 마라톤 캘린더</button>
  </nav>
  <iframe id="converter" src="index.html" title="구간 변환기"></iframe>
  <iframe id="calendar" title="마라톤 캘린더" hidden></iframe>
<script>
  const frames = { converter: document.getElementById('converter'), calendar: document.getElementById('calendar') };
  const srcs = { converter: 'index.html', calendar: 'calendar.html' };
  function show(view) {
    if (!frames[view]) view = 'converter';
    for (const k in frames) {
      frames[k].hidden = k !== view;
      if (k === view && !frames[k].getAttribute('src')) frames[k].src = srcs[k];
    }
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === view));
    try { history.replaceState(null, '', '#' + view); } catch (e) {}
  }
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => show(t.dataset.view)));
  show(location.hash.slice(1));
</script>
</body>
</html>
