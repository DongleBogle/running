<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마라톤 캘린더 - 접수중/접수예정 대회</title>
  <style>
    :root {
      --bg-dark: #0a0e17;
      --card-bg: #131b2e;
      --card-border: #1e293b;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent-neon: #10b981;
      --accent-gold: #facc15;
      --accent-cyan: #06b6d4;
      --accent-orange: #f97316;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --danger: #ef4444;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.5;
      padding-bottom: 60px;
    }
    .container { max-width: 1100px; margin: 0 auto; padding: 16px; }
    .top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
    .top h1 { font-size: 1.4rem; margin: 0; }
    .top a { color: var(--accent-cyan); font-size: 0.85rem; text-decoration: none; }
    .btn { display: inline-block; padding: 8px 14px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; text-decoration: none; border: 1px solid var(--card-border); }
    .btn-green { background: var(--accent-neon); color: #04120c; border-color: var(--accent-neon); }
    .btn-outline { background: none; color: var(--text-main); }
    .cal-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 12px; }
    .cal-toolbar .cal-month { font-size: 1.15rem; font-weight: 700; min-width: 120px; text-align: center; }
    .cal-toolbar .spacer { flex: 1; }
    .cal-btn { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-main); border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit; font-size: 0.85rem; }
    .cal-btn.active { border-color: var(--accent-neon); color: var(--accent-neon); }
    .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; background: var(--card-border); border: 1px solid var(--card-border); border-radius: 10px; overflow: hidden; }
    .cal-dow { background: var(--card-bg); text-align: center; padding: 6px 0; font-size: 0.78rem; color: var(--text-muted); }
    .cal-dow:first-child, .cal-cell.sun .cal-daynum { color: #f87171; }
    .cal-dow:nth-child(7), .cal-cell.sat .cal-daynum { color: #60a5fa; }
    .cal-cell { background: var(--bg-dark); min-height: 92px; padding: 4px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .cal-cell.other { opacity: 0.35; }
    .cal-cell.selected { outline: 2px solid var(--accent-neon); outline-offset: -2px; }
    .cal-cell.today .cal-daynum { background: var(--accent-neon); color: #04120c; border-radius: 10px; padding: 0 6px; }
    .cal-daynum { font-size: 0.78rem; font-weight: 600; align-self: flex-start; }
    .cal-chip { font-size: 0.7rem; line-height: 1.25; padding: 2px 5px; border-radius: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-left: 3px solid; background: var(--card-bg); }
    .cal-chip.open { border-color: var(--accent-neon); }
    .cal-chip.upcoming { border-color: var(--accent-gold); }
    .cal-chip.closed, .cal-chip.unknown { border-color: #64748b; color: var(--text-muted); }
    .cal-chip.optick { border-style: dashed; border-color: var(--accent-cyan); color: var(--accent-cyan); }
    .cal-more { font-size: 0.68rem; color: var(--text-muted); }
    .cal-legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 0.78rem; color: var(--text-muted); margin: 10px 0; }
    .cal-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
    .cal-list { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
    .cal-list h3 { font-size: 1rem; margin: 0; }
    .cal-item { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
    .cal-item .info { flex: 1 1 220px; min-width: 0; }
    .cal-item .name { font-weight: 700; }
    .cal-item .meta { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
    .cal-badge { font-size: 0.72rem; font-weight: 700; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
    .cal-badge.open { background: rgba(16,185,129,.15); color: var(--accent-neon); }
    .cal-badge.upcoming { background: rgba(250,204,21,.15); color: var(--accent-gold); }
    .cal-badge.closed, .cal-badge.unknown { background: rgba(100,116,139,.2); color: var(--text-muted); }
    .cal-empty { color: var(--text-muted); font-size: 0.9rem; padding: 12px 0; }
    @media (max-width: 640px) {
      .cal-cell { min-height: 54px; padding: 3px; }
      .cal-chip { font-size: 0; padding: 0; height: 6px; width: 6px; border: none; border-radius: 50%; background: var(--accent-neon); }
      .cal-chip.upcoming { background: var(--accent-gold); }
      .cal-chip.closed, .cal-chip.unknown { background: #64748b; }
      .cal-chip.optick { background: var(--accent-cyan); }
      .cal-cell .chips { display: flex; flex-wrap: wrap; gap: 3px; }
    }

  </style>
</head>
<body>
<div class="container">
  <div class="top">
    <h1>📅 마라톤 캘린더</h1>
    <a id="backLink" href="index.html">← 구간 변환기로 돌아가기</a>
  </div>
    <div class="cal-toolbar">
      <button class="cal-btn" onclick="calMove(-1)" aria-label="이전 달">◀</button>
      <div class="cal-month" id="calMonthLabel"></div>
      <button class="cal-btn" onclick="calMove(1)" aria-label="다음 달">▶</button>
      <button class="cal-btn" onclick="calToday()">오늘</button>
      <div class="spacer"></div>
      <button class="cal-btn active" data-calf="all" onclick="calFilter('all')">전체</button>
      <button class="cal-btn" data-calf="open" onclick="calFilter('open')">접수중</button>
      <button class="cal-btn" data-calf="upcoming" onclick="calFilter('upcoming')">접수예정</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-legend">
      <span><i style="background:var(--accent-neon)"></i>접수중</span>
      <span><i style="background:var(--accent-gold)"></i>접수예정</span>
      <span><i style="background:#64748b"></i>마감/정보없음</span>
      <span><i style="border:1px dashed var(--accent-cyan)"></i>접수 오픈일</span>
    </div>
    <div class="cal-list" id="calList"></div>
</div>
<script>
let calRaces = [], calLoaded = false, calFilterMode = 'all', calSelected = null;
const calNow = new Date();
let calYear = calNow.getFullYear(), calMonth = calNow.getMonth();

async function loadCalendar() {
  try {
    const res = await fetch('/data/marathon_calendar.json', { cache: 'no-cache' });
    calRaces = (await res.json()).races || [];
    calLoaded = true;
  } catch (e) {
    document.getElementById('calList').innerHTML = '<div class="cal-empty">캘린더 데이터를 불러오지 못했습니다.</div>';
    return;
  }
  renderCalendar();
}

const pad2 = n => String(n).padStart(2, '0');
const ymd = (y, m, d) => `${y}-${pad2(m + 1)}-${pad2(d)}`;
function calParse(s) { return s ? new Date(s.length <= 10 ? s + 'T00:00:00' : s) : null; }

function calStatus(r) {
  const reg = r.registration || {};
  const now = new Date();
  const opens = calParse(reg.opensAt);
  let closes = calParse(reg.closesAt);
  if (closes && String(reg.closesAt).length <= 10) closes = new Date(closes.getTime() + 86400000 - 1); // 마감일 당일 끝까지
  if (!opens && !closes) return 'unknown';
  if (opens && now < opens) return 'upcoming';
  if (closes && now > closes) return 'closed';
  if (new Date(r.date + 'T23:59:59') < now) return 'closed';
  return 'open';
}
const CAL_LABEL = { open: '접수중', upcoming: '접수예정', closed: '접수마감', unknown: '접수정보 없음' };

function calMatches(r) { return calFilterMode === 'all' || calStatus(r) === calFilterMode; }

function calEventsByDay() {
  const map = {};
  const add = (k, ev) => (map[k] = map[k] || []).push(ev);
  for (const r of calRaces) {
    if (!calMatches(r)) continue;
    add(r.date, { race: r, kind: 'race' });
    const o = r.registration && r.registration.opensAt;
    if (o && calStatus(r) !== 'closed') add(o.slice(0, 10), { race: r, kind: 'open' });
  }
  return map;
}

function renderCalendar() {
  document.getElementById('calMonthLabel').textContent = `${calYear}년 ${calMonth + 1}월`;
  const events = calEventsByDay();
  const first = new Date(calYear, calMonth, 1);
  const start = new Date(calYear, calMonth, 1 - first.getDay());
  const todayKey = ymd(calNow.getFullYear(), calNow.getMonth(), calNow.getDate());
  const maxChips = window.innerWidth <= 640 ? 99 : 3;
  let html = ['일', '월', '화', '수', '목', '금', '토'].map(d => `<div class="cal-dow">${d}</div>`).join('');
  for (let i = 0; i < 42; i++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    if (i >= 35 && d.getMonth() !== calMonth) break;
    const key = ymd(d.getFullYear(), d.getMonth(), d.getDate());
    const evs = events[key] || [];
    const cls = ['cal-cell', d.getMonth() !== calMonth ? 'other' : '', key === todayKey ? 'today' : '',
      key === calSelected ? 'selected' : '', d.getDay() === 0 ? 'sun' : '', d.getDay() === 6 ? 'sat' : ''].join(' ');
    const chips = evs.slice(0, maxChips).map(e => e.kind === 'race'
      ? `<div class="cal-chip ${calStatus(e.race)}" title="${calEsc(e.race.name)}">${calEsc(e.race.name)}</div>`
      : `<div class="cal-chip optick" title="접수 오픈: ${calEsc(e.race.name)}">접수오픈 ${calEsc(e.race.name)}</div>`).join('');
    const more = evs.length > maxChips ? `<div class="cal-more">+${evs.length - maxChips}개</div>` : '';
    html += `<div class="${cls}" onclick="calSelect('${key}')"><span class="cal-daynum">${d.getDate()}</span><div class="chips">${chips}</div>${more}</div>`;
  }
  document.getElementById('calGrid').innerHTML = html;
  renderCalList();
}

function calEsc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function calFmt(s) {
  const d = calParse(s);
  if (!d) return '';
  const base = `${d.getMonth() + 1}/${d.getDate()}`;
  return String(s).length > 10 ? `${base} ${pad2(d.getHours())}:${pad2(d.getMinutes())}` : base;
}

function renderCalList() {
  let races, title;
  if (calSelected) {
    races = calRaces.filter(r => calMatches(r) && (r.date === calSelected ||
      (r.registration && r.registration.opensAt && r.registration.opensAt.slice(0, 10) === calSelected)));
    title = `${calSelected} 일정`;
  } else {
    const prefix = `${calYear}-${pad2(calMonth + 1)}`;
    races = calRaces.filter(r => calMatches(r) && r.date.startsWith(prefix));
    title = `${calMonth + 1}월 대회`;
  }
  races.sort((a, b) => a.date.localeCompare(b.date));
  const items = races.map(r => {
    const st = calStatus(r), reg = r.registration || {};
    const period = reg.opensAt || reg.closesAt ? `접수 ${calFmt(reg.opensAt) || '?'} ~ ${calFmt(reg.closesAt) || '?'}` : '';
    const btn = reg.url && st !== 'closed'
      ? `<a class="btn btn-green" href="${calEsc(reg.url)}" target="_blank" rel="noopener noreferrer">${st === 'upcoming' ? '접수 페이지 보기' : '신청하러 가기'} ➔</a>`
      : (reg.url ? `<a class="btn btn-outline" href="${calEsc(reg.url)}" target="_blank" rel="noopener noreferrer">대회 페이지</a>` : '');
    return `<div class="cal-item">
      <span class="cal-badge ${st}">${CAL_LABEL[st]}</span>
      <div class="info"><div class="name">${calEsc(r.name)}</div>
        <div class="meta">${r.date} · ${calEsc(r.location || '')} · ${(r.distances || []).map(calEsc).join(' / ')}</div>
        ${period ? `<div class="meta">${period}</div>` : ''}</div>${btn}</div>`;
  }).join('');
  const clear = calSelected ? ' <button class="cal-btn" onclick="calSelect(null)">월 전체 보기</button>' : '';
  document.getElementById('calList').innerHTML = `<h3>${title}${clear}</h3>` + (items || '<div class="cal-empty">해당하는 대회가 없습니다.</div>');
}

function calSelect(key) { calSelected = key === calSelected ? null : key; renderCalendar(); }
function calMove(delta) {
  const d = new Date(calYear, calMonth + delta, 1);
  calYear = d.getFullYear(); calMonth = d.getMonth(); calSelected = null; renderCalendar();
}
function calToday() { calYear = calNow.getFullYear(); calMonth = calNow.getMonth(); calSelected = null; renderCalendar(); }
function calFilter(mode) {
  calFilterMode = mode;
  document.querySelectorAll('[data-calf]').forEach(b => b.classList.toggle('active', b.dataset.calf === mode));
  renderCalendar();
}
window.addEventListener('resize', () => { if (calLoaded && !document.getElementById('viewCalendar').classList.contains('view-hidden')) renderCalendar(); });
if (window.self !== window.top) document.getElementById('backLink').style.display = 'none';
loadCalendar();

</script>
</body>
</html>
